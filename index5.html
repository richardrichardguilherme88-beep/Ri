<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo 1988 — Richard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Courier New", monospace; }
        body {
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            min-height: 100vh;
        }

        h1 {
            color: #00FF00;
            font-size: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #00FF00;
            padding: 8px 15px;
        }

        .placar {
            background: #000000;
            border: 2px solid #00FF00;
            color: #00FF00;
            padding: 10px 20px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
            width: 320px;
            display: flex;
            justify-content: space-between;
        }

        canvas {
            background: #000000;
            border: 3px solid #00FF00;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .controles {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #000000;
            border: 2px solid #00FF00;
            color: #00FF00;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn:active {
            background: #00FF00;
            color: #000000;
        }

        .instrucoes {
            margin-top: 15px;
            color: #00FF00;
            font-size: 12px;
            text-align: center;
            line-height: 1.5;
        }

        .piscando {
            animation: piscar 1s infinite;
        }
        @keyframes piscar {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<h1>JOGO 1988 — RICHARD</h1>

<div class="placar">
    <span>PONTOS: <span id="pontos">0</span></span>
    <span>ESTRELAS: <span id="estrelas">0</span>/3</span>
</div>

<canvas id="jogo" width="320" height="240"></canvas>

<div class="controles">
    <button class="btn" id="esq">◀</button>
    <button class="btn" id="pular">▲ PULAR</button>
    <button class="btn" id="dir">▶</button>
</div>

<div class="instrucoes">
    ◀ ▲ ▶ Use as setas ou toque nos botões<br>
    Pegue as estrelas ★ e fuja dos inimigos ●<br>
    <span class="piscando">PREPARADO?</span>
</div>

<script>
const tela = document.getElementById('jogo');
const ctx = tela.getContext('2d');

// Jogador — quadradinho estilo 1988
const jogador = {
    x: 40,
    y: 190,
    w: 20,
    h: 24,
    vx: 0,
    vy: 0,
    noChao: false,
    cor: '#00FF00'
};

// Plataformas
const chao = 210;
const plataformas = [
    { x: 0, y: chao, w: 320, h: 30, cor: '#008800' },
    { x: 60, y: 160, w: 80, h: 12, cor: '#008800' },
    { x: 200, y: 130, w: 80, h: 12, cor: '#008800' },
    { x: 30, y: 90, w: 70, h: 12, cor: '#008800' }
];

// Estrelas
const estrelas = [
    { x: 90, y: 130, pega: false },
    { x: 230, y: 100, pega: false },
    { x: 55, y: 60, pega: false }
];

// Inimigos
const inimigos = [
    { x: 150, y: 185, w: 16, h: 16, vx: 1.5, min: 100, max: 280, cor: '#FF0000' }
];

let pontos = 0;
let qtdEstrelas = 0;
let tecla = { esq: false, dir: false, pula: false };

// Teclado
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') tecla.esq = true;
    if (e.key === 'ArrowRight') tecla.dir = true;
    if (e.key === ' ' || e.key === 'ArrowUp') tecla.pula = true;
});
document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') tecla.esq = false;
    if (e.key === 'ArrowRight') tecla.dir = false;
    if (e.key === ' ' || e.key === 'ArrowUp') tecla.pula = false;
});

// Toque
function toque(el, acao, estado) {
    document.getElementById(el).addEventListener(acao, () => tecla[estado] = estado === 'pula' ? true : !estado.includes('n'));
    document.getElementById(el).addEventListener('touchend', () => tecla[estado] = false);
}
toque('esq', 'touchstart', 'esq');
toque('dir', 'touchstart', 'dir');
toque('pular', 'touchstart', 'pula');

function atualizar() {
    // Movimento
    if (tecla.dir) jogador.vx = 3;
    else if (tecla.esq) jogador.vx = -3;
    else jogador.vx = 0;

    // Pulo
    if (tecla.pula && jogador.noChao) {
        jogador.vy = -9;
        jogador.noChao = false;
    }

    // Gravidade
    jogador.vy += 0.5;
    jogador.x += jogador.vx;
    jogador.y += jogador.vy;

    // Limites
    if (jogador.x < 0) jogador.x = 0;
    if (jogador.x + jogador.w > tela.width) jogador.x = tela.width - jogador.w;

    // Colisão plataformas
    jogador.noChao = false;
    for (let p of plataformas) {
        if (jogador.x + jogador.w > p.x && jogador.x < p.x + p.w &&
            jogador.y + jogador.h > p.y && jogador.y + jogador.h < p.y + p.h + 8 &&
            jogador.vy >= 0) {
            jogador.y = p.y - jogador.h;
            jogador.vy = 0;
            jogador.noChao = true;
        }
    }

    // Pegar estrelas
    for (let e of estrelas) {
        if (!e.pega && jogador.x + jogador.w > e.x && jogador.x < e.x + 14 &&
            jogador.y + jogador.h > e.y && jogador.y < e.y + 14) {
            e.pega = true;
            pontos += 10;
            qtdEstrelas++;
            atualizarPlacar();
        }
    }

    // Inimigos
    for (let i of inimigos) {
        i.x += i.vx;
        if (i.x <= i.min || i.x + i.w >= i.max) i.vx *= -1;

        // Bateu?
        if (jogador.x + jogador.w > i.x && jogador.x < i.x + i.w &&
            jogador.y + jogador.h > i.y && jogador.y < i.y + i.h) {
            pontos = Math.max(0, pontos - 5);
            jogador.x = 40; jogador.y = 190; jogador.vy = 0;
            atualizarPlacar();
        }
    }

    // Ganhou!
    if (qtdEstrelas === 3) {
        alert('★ PARABÉNS RICHARD ★\nVOCÊ VENCEU!\nJOGO 1988 ★');
        pontos = 0; qtdEstrelas = 0;
        estrelas.forEach(e => e.pega = false);
        jogador.x = 40; jogador.y = 190;
        atualizarPlacar();
    }
}

function atualizarPlacar() {
    document.getElementById('pontos').textContent = pontos;
    document.getElementById('estrelas').textContent = qtdEstrelas;
}

function desenhar() {
    // Fundo preto
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, tela.width, tela.height);

    // Grade estilo tela antiga
    ctx.strokeStyle = '#001100';
    ctx.lineWidth = 1;
    for (let x = 0; x < tela.width; x += 16) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, tela.height); ctx.stroke();
    }
    for (let y = 0; y < tela.height; y += 16) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(tela.width, y); ctx.stroke();
    }

    // Plataformas
    for (let p of plataformas) {
        ctx.fillStyle = p.cor;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        // Borda branca
        ctx.fillStyle = '#00FF00';
        ctx.fillRect(p.x, p.y, p.w, 2);
    }

    // Estrelas
    ctx.fillStyle = '#FFFF00';
    for (let e of estrelas) {
        if (!e.pega) {
            ctx.fillRect(e.x + 5, e.y, 4, 14);
            ctx.fillRect(e.x, e.y + 5, 14, 4);
        }
    }

    // Inimigos
    for (let i of inimigos) {
        ctx.fillStyle = i.cor;
        ctx.fillRect(i.x, i.y, i.w, i.h);
        // Olhos
        ctx.fillStyle = '#000000';
        ctx.fillRect(i.x + 2, i.y + 4, 4, 4);
        ctx.fillRect(i.x + 10, i.y + 4, 4, 4);
    }

    // Jogador
    ctx.fillStyle = jogador.cor;
    ctx.fillRect(jogador.x + 4, jogador.y, 12, 10); // Cabeça
    ctx.fillRect(jogador.x + 2, jogador.y + 10, 16, 10); // Corpo
    ctx.fillRect(jogador.x + 4, jogador.y + 20, 4, 4); // Pé
    ctx.fillRect(jogador.x + 12, jogador.y + 20, 4, 4); // Pé
    // Olhos
    ctx.fillStyle = '#000000';
    ctx.fillRect(jogador.x + 6, jogador.y + 3, 2, 3);
    ctx.fillRect(jogador.x + 12, jogador.y + 3, 2, 3);
}

function loop() {
    atualizar();
    desenhar();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
